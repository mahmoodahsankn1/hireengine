<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1400" viewBox="0 0 900 1400">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
    <style>
      text { font-family: "Times New Roman", serif; fill: #111; }
      .box { fill: #fff; stroke: #111; stroke-width: 2; }
      .sep { stroke: #111; stroke-width: 1.5; }
      .title { font-size: 22px; text-anchor: middle; }
      .attr { font-size: 18px; }
      .rel { fill: none; stroke: #111; stroke-width: 2; marker-end: url(#arrow); }
      .label { font-size: 17px; font-style: italic; }
      .mult { font-size: 15px; }
    </style>
  </defs>

  <g>
    <rect class="box" x="70" y="40" width="350" height="235"/>
    <line class="sep" x1="70" y1="78" x2="420" y2="78"/>
    <line class="sep" x1="70" y1="237" x2="420" y2="237"/>
    <text class="title" x="245" y="67">User</text>
    <text class="attr" x="85" y="107">+ id : UUID</text>
    <text class="attr" x="85" y="134">+ email : Email (unique)</text>
    <text class="attr" x="85" y="161">+ full_name : Text</text>
    <text class="attr" x="85" y="188">+ company_name : Text</text>
    <text class="attr" x="85" y="215">+ is_email_verified : Boolean</text>
    <text class="attr" x="85" y="262">+ recruiter account</text>
  </g>

  <g>
    <rect class="box" x="70" y="345" width="350" height="275"/>
    <line class="sep" x1="70" y1="383" x2="420" y2="383"/>
    <line class="sep" x1="70" y1="582" x2="420" y2="582"/>
    <text class="title" x="245" y="372">Job</text>
    <text class="attr" x="85" y="412">+ id : UUID</text>
    <text class="attr" x="85" y="439">+ hr : User (FK)</text>
    <text class="attr" x="85" y="466">+ title : Text</text>
    <text class="attr" x="85" y="493">+ required_skills : JSON</text>
    <text class="attr" x="85" y="520">+ application_deadline : DateTime</text>
    <text class="attr" x="85" y="547">+ stage : Text</text>
    <text class="attr" x="85" y="574">+ form_slug : Text (unique)</text>
    <text class="attr" x="85" y="607">+ hiring role and workflow</text>
  </g>

  <g>
    <rect class="box" x="490" y="365" width="350" height="235"/>
    <line class="sep" x1="490" y1="403" x2="840" y2="403"/>
    <line class="sep" x1="490" y1="562" x2="840" y2="562"/>
    <text class="title" x="665" y="392">AvailabilityWindow</text>
    <text class="attr" x="505" y="432">+ id : UUID</text>
    <text class="attr" x="505" y="459">+ job : Job (FK)</text>
    <text class="attr" x="505" y="486">+ round : Integer (2 or 3)</text>
    <text class="attr" x="505" y="513">+ start_at : DateTime</text>
    <text class="attr" x="505" y="540">+ end_at : DateTime</text>
    <text class="attr" x="505" y="587">+ interview availability</text>
  </g>

  <g>
    <rect class="box" x="70" y="700" width="350" height="300"/>
    <line class="sep" x1="70" y1="738" x2="420" y2="738"/>
    <line class="sep" x1="70" y1="962" x2="420" y2="962"/>
    <text class="title" x="245" y="727">Application</text>
    <text class="attr" x="85" y="767">+ id : UUID</text>
    <text class="attr" x="85" y="794">+ job : Job (FK)</text>
    <text class="attr" x="85" y="821">+ full_name / email / phone</text>
    <text class="attr" x="85" y="848">+ resume_file : File</text>
    <text class="attr" x="85" y="875">+ anonymized_text : Text</text>
    <text class="attr" x="85" y="902">+ cv_score : Integer (0--100)</text>
    <text class="attr" x="85" y="929">+ pipeline_status : Text</text>
    <text class="attr" x="85" y="989">+ candidate submission and review</text>
  </g>

  <g>
    <rect class="box" x="490" y="700" width="350" height="300"/>
    <line class="sep" x1="490" y1="738" x2="840" y2="738"/>
    <line class="sep" x1="490" y1="962" x2="840" y2="962"/>
    <text class="title" x="665" y="727">Interview</text>
    <text class="attr" x="505" y="767">+ id : UUID</text>
    <text class="attr" x="505" y="794">+ job : Job (FK)</text>
    <text class="attr" x="505" y="821">+ application : Application (FK)</text>
    <text class="attr" x="505" y="848">+ hr : User (FK)</text>
    <text class="attr" x="505" y="875">+ kind : AI or HR</text>
    <text class="attr" x="505" y="902">+ start_at : DateTime</text>
    <text class="attr" x="505" y="929">+ status : Text</text>
    <text class="attr" x="505" y="989">+ scheduled candidate interview</text>
  </g>

  <g>
    <rect class="box" x="70" y="1080" width="350" height="235"/>
    <line class="sep" x1="70" y1="1118" x2="420" y2="1118"/>
    <line class="sep" x1="70" y1="1277" x2="420" y2="1277"/>
    <text class="title" x="245" y="1107">AIResult</text>
    <text class="attr" x="85" y="1147">+ interview : Interview (one-to-one)</text>
    <text class="attr" x="85" y="1174">+ transcript : JSON</text>
    <text class="attr" x="85" y="1201">+ score : Integer (0--100)</text>
    <text class="attr" x="85" y="1228">+ score_breakdown : JSON</text>
    <text class="attr" x="85" y="1255">+ scoring_status : Text</text>
    <text class="attr" x="85" y="1302">+ AI interview result</text>
  </g>

  <g>
    <rect class="box" x="490" y="1080" width="350" height="235"/>
    <line class="sep" x1="490" y1="1118" x2="840" y2="1118"/>
    <line class="sep" x1="490" y1="1277" x2="840" y2="1277"/>
    <text class="title" x="665" y="1107">Feedback</text>
    <text class="attr" x="505" y="1147">+ interview : Interview (one-to-one)</text>
    <text class="attr" x="505" y="1174">+ rating : Integer (1--10)</text>
    <text class="attr" x="505" y="1201">+ notes : Text</text>
    <text class="attr" x="505" y="1228">+ decision : selected / rejected</text>
    <text class="attr" x="505" y="1255">+ submitted_at : DateTime</text>
    <text class="attr" x="505" y="1302">+ recruiter evaluation</text>
  </g>

  <path class="rel" d="M245 275 L245 345"/>
  <text class="label" x="260" y="317">owns</text>
  <text class="mult" x="225" y="298">1</text>
  <text class="mult" x="225" y="340">0..*</text>

  <path class="rel" d="M420 470 L490 470"/>
  <text class="label" x="431" y="454">has</text>
  <text class="mult" x="424" y="493">1</text>
  <text class="mult" x="463" y="493">0..*</text>

  <path class="rel" d="M245 620 L245 700"/>
  <text class="label" x="260" y="665">receives</text>
  <text class="mult" x="225" y="644">1</text>
  <text class="mult" x="225" y="694">0..*</text>

  <path class="rel" d="M420 850 L490 850"/>
  <text class="label" x="431" y="835">interviews</text>
  <text class="mult" x="424" y="875">1</text>
  <text class="mult" x="463" y="875">0..2</text>

  <path class="rel" d="M575 1000 L390 1080"/>
  <text class="label" x="450" y="1040">has result</text>
  <text class="mult" x="560" y="1022">1</text>
  <text class="mult" x="400" y="1072">0..1</text>

  <path class="rel" d="M755 1000 L580 1080"/>
  <text class="label" x="650" y="1040">has feedback</text>
  <text class="mult" x="740" y="1022">1</text>
  <text class="mult" x="590" y="1072">0..1</text>
</svg>
