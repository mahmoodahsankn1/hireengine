version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: hireengine_db
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-hireengine}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: hireengine_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: hireengine_api
    restart: always
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./api:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - FRONTEND_URL=${FRONTEND_URL:-https://hireengine.vercel.app}
    depends_on:
      - db
      - redis

  celery_worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: hireengine_celery_worker
    restart: always
    command: celery -A hireengine worker -l info
    volumes:
      - ./api:/app
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - FRONTEND_URL=${FRONTEND_URL:-https://hireengine.vercel.app}
    depends_on:
      - db
      - redis

  celery_beat:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: hireengine_celery_beat
    restart: always
    command: celery -A hireengine beat -l info
    volumes:
      - ./api:/app
    env_file:
      - .env
    environment:
      - DB_HOST=db
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - FRONTEND_URL=${FRONTEND_URL:-https://hireengine.vercel.app}
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  redis_data:
